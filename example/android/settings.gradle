pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.3.0" apply false
    id "org.jetbrains.kotlin.android" version "1.8.10" apply false
}

include ':app'
include ':gallery_saver_fix'

// Fix for gallery_saver namespace issue
gradle.settingsEvaluated { settings ->
    settings.dependencyResolutionManagement.versionCatalogs.create('libs').from(files('libs.versions.toml'))
}

gradle.beforeProject { project ->
    if (project.name == 'gallery_saver') {
        project.plugins.withId('com.android.library') {
            project.android {
                namespace = 'carnegietechnologies.gallery_saver'
            }
        }
        project.plugins.withId('org.jetbrains.kotlin.android') {
            project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                kotlinOptions {
                    jvmTarget = '1.8'
                }
            }
        }
    }
}
